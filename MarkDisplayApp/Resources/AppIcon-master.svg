<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect x="32" y="32" width="960" height="960" rx="220"
        fill="#F4F4F4"/>

  <!-- Screen -->
  <rect x="230" y="330" width="560" height="340" rx="28"
        fill="none"
        stroke="#161616"
        stroke-width="36"/>

  <!-- Monitor Stand -->
  <rect x="478" y="670" width="68" height="110"
        fill="#161616"/>

  <rect x="360" y="760" width="304" height="38" rx="19"
        fill="#161616"/>

  <!-- Pencil Body -->
  <g transform="rotate(-45 580 430)">
    <rect x="500" y="180"
          width="110" height="420"
          rx="8"
          fill="#0F62FE"/>

    <!-- Eraser -->
    <rect x="500" y="110"
          width="110" height="70"
          rx="16"
          fill="#4589FF"/>

    <!-- Ferrule -->
    <rect x="500" y="180"
          width="110" height="20"
          fill="#A6C8FF"/>

    <!-- Pencil Tip -->
    <polygon points="500,600 610,600 555,685"
             fill="#161616"/>
  </g>

</svg>